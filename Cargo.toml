[package]
name = "tmac"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Run hook-capable AI CLIs in tmux panes and type into them only when they can take input"

[dependencies]
clap = { version = "=4.6.9", features = ["derive"] }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
signal-hook = "=0.4.6"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
toml = "=1.2.1"
uuid = { version = "=1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
