name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          cache: true
      - name: Install tmux (used by the end-to-end tests)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }
          else
            command -v tmux || brew install tmux
          fi
          tmux -V
          python3 --version
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
